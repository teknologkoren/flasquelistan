[project]
name = "flasquelistan"
version = "1.0.0"
description = "Implementation of Strequelistan with Flask and progressive enhancement 🍻"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "bcrypt",
    "click>=8.1",
    "ffmpy",
    "flask>=3.1",
    "flask-admin[sqlalchemy]>=2.0",
    "flask-babel>=4.0",
    "flask-HTTPAuth",
    "flask-login",
    "flask-reuploaded",
    "flask-socketio",
    "flask-sqlalchemy>=3.1",
    "flask-wtf>=1.2",
    "gevent",
    "gevent-websocket",
    "gunicorn",
    "markdown",
    "phonenumbers",
    "pillow",
    "requests",
    "requests-oauthlib",
    "sh",
    # Held below 2.1: Float no longer subclasses Numeric there, so Flask-Admin
    # (which matches converters by class name in the MRO) silently drops Float
    # columns such as Article.standardglas from its forms.
    "sqlalchemy>=2.0,<2.1",
    "vobject",
    "werkzeug>=3.1",
    # Held below 3.3: its select widget renders an empty choice label as the
    # value, so Flask-Admin's blank option in relationship dropdowns reads
    # "__None". 3.3 also deprecates our tuple choices (removed in 3.4).
    "wtforms[email]>=3.1,<3.3",
]

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "pytest-xdist",
    "ruff",
]

[tool.ruff]
# Matches the dominant style of the existing code; do not reformat wholesale.
line-length = 100

[tool.ruff.lint]
# Deliberately minimal: syntax errors, undefined names, unused imports/
# variables (F), basic pycodestyle errors (E4/E7/E9), and bare excepts
# (E722). Widen once the codebase is cleaner.
select = ["E4", "E7", "E9", "F", "E722"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "*_test.py"
