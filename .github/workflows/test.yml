name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The songbook-viewer submodule is private and not needed for the
      # Python tests, so we deliberately do not check out submodules.
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run coverage run -m pytest -q

      # Fails if coverage drops below the fail_under threshold in .coveragerc.
      - name: Coverage report
        run: uv run coverage report

      - name: Lint
        run: uv run ruff check .

      # Production installs without the dev group, so a runtime dependency
      # that only arrives through a dev tool (gunicorn 27 needing packaging,
      # which pytest also brings) passes the tests above but crashes the
      # server. Install the way production does and load the gevent worker.
      - name: Production install loads the gunicorn worker
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync python -c "import geventwebsocket.gunicorn.workers, flasquelistan.factory"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Unit tests for JavaScript (tests/js/), with Node's built-in runner.
      - name: Run JavaScript tests
        run: node --test 'tests/js/*.test.js'
