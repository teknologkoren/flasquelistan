# Development override: run the Docker image with the source tree
# bind-mounted and gunicorn reloading on changes. Useful for testing with
# gunicorn and websockets on a pinned Python — the fastest day-to-day loop is
# still `flask run` outside Docker, see README.md. Production does not use
# Docker (see docs/DEPLOYMENT.md).
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Note: with the whole repo mounted over /app, the songbook (/bok/) and the
# compiled translations come from your working tree (flasquelistan/songbook_dist/
# and local .mo files), not from the image.
services:
  app:
    volumes:
      - .:/app  # safe: the virtualenv lives in /opt/venv
    environment:
      # Only for `flask` CLI commands run in the container (`docker compose
      # exec app flask ...`). The gunicorn server below takes its debug mode
      # from DEBUG in config.py and instance/config.py instead, which this
      # does not override. Keep DEBUG = True there: outside debug mode the
      # app links to resized images that only the production front-end
      # server serves, so uploaded pictures won't load.
      FLASK_DEBUG: "1"
    command: >
      gunicorn -k geventwebsocket.gunicorn.workers.GeventWebSocketWorker
      -w 1 -b 0.0.0.0:8000 --reload app:app
